server {
    listen 8080;
    server_tokens off;
    default_type text/plain;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz {
        access_log off;
        return 200 "Control Plane development entrypoint is running\n";
    }
    location /api/ {
        # Resolve again after an API container recreation.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 503 "TrustTunnel Control Plane development runtime. Frontends are not implemented.\n";
    }
}
