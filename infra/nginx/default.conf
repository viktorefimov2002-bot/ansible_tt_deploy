limit_req_zone $binary_remote_addr zone=auth_login:1m rate=5r/m;
# Direct edge: TCP peer only. No real_ip_header/set_real_ip_from trusts client headers.
limit_req_zone $binary_remote_addr zone=client_exchange:1m rate=5r/m;

server {
    listen 8080;
    server_tokens off;
    default_type text/plain;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 8k;
    location = /api/auth/login {
        access_log off;
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/client/exchange {
        access_log off;
        limit_req zone=client_exchange burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        access_log off;
        return 200 "Control Plane development entrypoint is running\n";
    }
    location /api/ {
        access_log off;
        # Resolve again after an API container recreation.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /client { return 302 /client/; }
    location /client/ {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /client/index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location / {
        return 503 "TrustTunnel Control Plane. Client Portal: /client/\n";
    }
}
