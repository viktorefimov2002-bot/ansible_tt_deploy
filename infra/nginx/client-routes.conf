location = /api/client/exchange {
    limit_except POST { deny all; }
    limit_req zone=client_exchange burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ ^/api/client/(session|me|servers)$ {
    limit_except GET { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location = /api/client/logout {
    limit_except POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location = /api/client/devices {
    limit_except GET POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/client/devices/[0-9a-fA-F-]{36}$" {
    limit_except DELETE { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/client/devices/[0-9a-fA-F-]{36}/(credentials|provisioning)$" {
    limit_except GET { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/client/devices/[0-9a-fA-F-]{36}/(credentials|configurations)/[0-9a-fA-F-]{36}$" {
    limit_except POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
