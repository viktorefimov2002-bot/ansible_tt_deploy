location = /api/auth/login {
    limit_except POST { deny all; }
    limit_req zone=auth_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/ttcp/proxy.conf;
}
location = /api/auth/me {
    limit_except GET { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location = /api/auth/logout {
    limit_except POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/jobs(?:/[0-9a-fA-F-]{36}(?:/logs)?)?$" {
    limit_except GET { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/jobs/[0-9a-fA-F-]{36}/cancel$" {
    limit_except POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location = /api/servers {
    limit_except GET POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/servers/[0-9a-fA-F-]{36}$" {
    limit_except GET PUT DELETE { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/servers/[0-9a-fA-F-]{36}/(enabled|credentials)$" {
    limit_except PUT { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/servers/[0-9a-fA-F-]{36}/(preflight|status)$" {
    limit_except POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location = /api/vpn-users {
    limit_except GET POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/vpn-users/[0-9a-fA-F-]{36}$" {
    limit_except GET PATCH { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/vpn-users/[0-9a-fA-F-]{36}/(enabled|access)$" {
    limit_except PUT { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/vpn-users/[0-9a-fA-F-]{36}/(devices|invitations)$" {
    limit_except GET POST { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/vpn-users/[0-9a-fA-F-]{36}/(devices|invitations)/[0-9a-fA-F-]{36}$" {
    limit_except GET DELETE { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/vpn-users/[0-9a-fA-F-]{36}/devices/[0-9a-fA-F-]{36}/credentials$" {
    limit_except GET { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
location ~ "^/api/vpn-users/[0-9a-fA-F-]{36}/devices/[0-9a-fA-F-]{36}/credentials/[0-9a-fA-F-]{36}$" {
    limit_except POST DELETE { deny all; }
    include /etc/nginx/ttcp/proxy.conf;
}
