server {
    listen 8080;
    server_tokens off;
    default_type text/plain;
    location = /healthz {
        access_log off;
        return 200 "TTCP-003 API placeholder process is running\n";
    }
    location / {
        return 503 "Control Plane API is not implemented; see TTCP-004.\n";
    }
}
