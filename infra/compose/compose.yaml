name: ttcp-dev

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *runtime
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttcp}
      POSTGRES_USER: ${POSTGRES_USER:-ttcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 384m
    shm_size: 128m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    <<: *runtime
    image: redis:7.4.11-alpine3.21
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    entrypoint: [/bin/sh, /usr/local/etc/redis/start.sh]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/start.sh:/usr/local/etc/redis/start.sh:ro
    tmpfs:
      - /run/redis
      - /data
    networks: [queue]
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # Runtime topology only; replace with FastAPI in TTCP-004.
  api:
    <<: *runtime
    image: nginx:1.30.5-alpine3.24
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./placeholders/api.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [application, database, queue]
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 5

  # No queue client, jobs, credentials or Ansible integration yet.
  worker:
    <<: *runtime
    image: alpine:3.23.3
    command: [/bin/sh, /placeholder/worker.sh]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./placeholders/worker.sh:/placeholder/worker.sh:ro
    networks: [database, queue]
    mem_limit: 32m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Only the placeholder process is checked, not a functioning worker.
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1']
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    <<: *runtime
    image: nginx:1.30.5-alpine3.24
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [entrypoint, application]
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 5

  victoriametrics:
    <<: *runtime
    image: victoriametrics/victoria-metrics:v1.152.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VM_RETENTION:-7d}
      - -memory.allowedBytes=256MiB
      - -selfScrapeInterval=30s
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    networks: [metrics]
    mem_limit: 384m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8428/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    <<: *runtime
    image: grafana/grafana:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro
    networks: [entrypoint, metrics]
    mem_limit: 256m
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  entrypoint:
  application:
    internal: true
  database:
    internal: true
  queue:
    internal: true
  metrics:
    internal: true

volumes:
  postgres_data:
  victoriametrics_data:
  grafana_data:
