name: ttcp-dev

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-environment: &app-environment
  TTCP_POSTGRES_HOST: postgres
  TTCP_POSTGRES_DB: ${POSTGRES_DB:-ttcp}
  TTCP_POSTGRES_USER: ${POSTGRES_APP_USER:-${POSTGRES_USER:-ttcp}}
  TTCP_POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
  TTCP_REDIS_HOST: redis
  TTCP_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  TTCP_LOG_LEVEL: ${TTCP_LOG_LEVEL:-INFO}

services:
  migrate:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: apps/Dockerfile
    environment:
      TTCP_POSTGRES_HOST: postgres
      TTCP_POSTGRES_DB: ${POSTGRES_DB:-ttcp}
      TTCP_POSTGRES_USER: ${POSTGRES_USER:-ttcp}
      TTCP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [python, -m, alembic, upgrade, head]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database]
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *runtime
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttcp}
      POSTGRES_USER: ${POSTGRES_USER:-ttcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 384m
    shm_size: 128m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    <<: *runtime
    image: redis:7.4.11-alpine3.21
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    entrypoint: [/bin/sh, /usr/local/etc/redis/start.sh]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/start.sh:/usr/local/etc/redis/start.sh:ro
    tmpfs:
      - /run/redis
      - /data
    networks: [queue]
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *runtime
    build:
      context: ../..
      dockerfile: apps/Dockerfile
    environment:
      <<: *app-environment
      # Omit the key to keep the TTCP-004 health-only runtime; auth fails closed.
      TTCP_AUTH_ENCRYPTION_KEY: ${TTCP_AUTH_ENCRYPTION_KEY:-}
      TTCP_AUTH_SESSION_SECONDS: ${TTCP_AUTH_SESSION_SECONDS:-28800}
    command: [python, -m, apps.api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application, database, queue]
    mem_limit: 192m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, apps.shared.healthcheck, api]
      interval: 10s
      timeout: 15s
      retries: 5

  # Durable job consumer; PostgreSQL recovery survives Redis loss.
  worker:
    <<: *runtime
    build:
      context: ../..
      dockerfile: apps/Dockerfile
      target: worker
    environment:
      <<: *app-environment
      TTCP_AUTH_ENCRYPTION_KEY: ${TTCP_AUTH_ENCRYPTION_KEY:-}
    command: [python, -m, apps.worker]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database, queue, management_egress]
    mem_limit: 128m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Container state checks the process; this independent probe checks dependencies.
    healthcheck:
      test: [CMD, python, -m, apps.shared.healthcheck, worker]
      interval: 10s
      timeout: 15s
      retries: 3

  nginx:
    <<: *runtime
    image: nginx:1.30.5-alpine3.24
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [entrypoint, application]
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 5

  victoriametrics:
    <<: *runtime
    image: victoriametrics/victoria-metrics:v1.152.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VM_RETENTION:-7d}
      - -memory.allowedBytes=256MiB
      - -selfScrapeInterval=30s
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    networks: [metrics]
    mem_limit: 384m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8428/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    <<: *runtime
    image: grafana/grafana:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro
    networks: [entrypoint, metrics]
    mem_limit: 256m
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  entrypoint:
  # Worker-initiated SSH/DNS only; no published ports or database exposure.
  management_egress:
  application:
    internal: true
  database:
    internal: true
  queue:
    internal: true
  metrics:
    internal: true

volumes:
  postgres_data:
  victoriametrics_data:
  grafana_data:
