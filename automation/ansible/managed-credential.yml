---
- name: Apply one typed TrustTunnel credential operation
  hosts: trusttunnel
  gather_facts: false
  become: false
  tasks:
    - name: Invoke the fixed privileged credential helper
      ansible.builtin.command:
        argv: [/usr/bin/sudo, -n, /usr/local/sbin/ttcp-node-credential]
        stdin: "{{ ttcp_credential_payload | to_json }}"
      register: credential_result
      no_log: true
      changed_when: true

    - name: Transfer generator output into isolated controller delivery file
      ansible.builtin.copy:
        content: "{{ credential_result.stdout }}"
        dest: "{{ trusttunnel_client_config_local_dir | dirname }}/delivery.json"
        mode: "0600"
      delegate_to: localhost
      no_log: true
      when:
        - ttcp_credential_payload.operation == 'credential.create'
        - ttcp_credential_payload.public_address is defined
