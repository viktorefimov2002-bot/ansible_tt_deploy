---
- name: Apply one typed TrustTunnel credential operation
  hosts: trusttunnel
  gather_facts: false
  become: false
  tasks:
    - name: Invoke the fixed privileged credential helper
      ansible.builtin.command:
        argv: [/usr/bin/sudo, -n, /usr/local/sbin/ttcp-node-credential]
        stdin: "{{ ttcp_credential_payload | to_json }}"
      no_log: true
      changed_when: true
